    /* ============== PRINT STYLES (BOTH PORTRAIT & LANDSCAPE) ============== */
    @media print {
      html, body {
        background: #fff !important;
        margin: 0 !important;
        padding: 0 !important;
        font-family: "Times New Roman", Times, serif !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      /* Default: portrait */
      @page {
        size: A4 portrait;
        margin: 12mm 10mm;
      }
      /* When body has landscape class, switch @page */
      body.landscape @page {
        size: A4 landscape;
        margin: 10mm 8mm;
      }
      body.portrait @page {
        size: A4 portrait;
        margin: 12mm 10mm;
      }

      body * { visibility: hidden !important; }
      .preview-wrap, .preview-wrap * { visibility: visible !important; }
      .preview-wrap {
        position: absolute !important;
        left: 0 !important; top: 0 !important;
        width: 100% !important;
        padding: 0 !important; margin: 0 !important;
        border: none !important; overflow: visible !important;
        background: #fff !important;
      }
      .no-print, .tabs, .app-header, .user-box, .course-bar,
      .admin-panel, .upload-box, .faculty-courses-panel, .api-status,
      .shared-notice, .highest-hint, .toolbar, .card {
        display: none !important;
      }
      .print-page {
        padding: 0 !important;
        font-size: 10px !important;
        color: #000 !important;
        font-family: "Times New Roman", Times, serif !important;
        width: 100% !important;
      }
      .print-page .board { font-size: 13px !important; margin: 3px 0 !important; }
      .print-page .title { font-size: 12px !important; margin: 3px 0 !important; }
      .meta-grid { font-size: 10px !important; gap: 2px 10px !important; }
      table.marks { font-size: 9.5px !important; width: 100% !important; page-break-inside: auto; }
      table.marks th, table.marks td {
        padding: 1.5px 2px !important;
        border: 0.5px solid #000 !important;
        background: #fff !important;
        color: #000 !important;
      }
      table.marks th { background: #fff !important; font-weight: 700 !important; }
      table.marks tr.below-min td,
      table.marks tr.ok td { background: #fff !important; }
      table.marks input.cell {
        height: auto !important;
        min-width: 18px !important;
        padding: 0 !important;
        font-size: 9.5px !important;
        -webkit-appearance: none !important;
        appearance: none !important;
        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
        text-align: center !important;
      }
      input.cell:focus { background: transparent !important; outline: none !important; }
      .footer-sign { margin-top: 18mm !important; page-break-inside: avoid; font-size: 10px !important; }
      .footer-sign .line, .footer-sign .single-line { border-top: 1px solid #000 !important; }
      thead { display: table-header-group; }
      tr { page-break-inside: avoid; }
      .preview-wrap .print-page { max-width: 100% !important; }
    }
  </style>

<body class="portrait">
  <div id="root"></div>
  <!-- Dynamic @page style for both orientations -->
  <style id="print-orientation">@page { size: A4 portrait; margin: 12mm 10mm; }</style>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef, useCallback } = React;

    /* ============================================================
       ⭐⭐⭐  PASTE YOUR APPS SCRIPT URL HERE  ⭐⭐⭐
       ============================================================ */
    const GOOGLE_API_URL = "https://script.google.com/macros/s/AKfycbwjULTJKFfhSxrfIhgxjvcexaUcJ7fb0_8B8-wHVAVsthkHYHIR4PDQF8I_lSbDBifFKw/exec";

    /* ============================================================
       CONSTANTS
       ============================================================ */
    const USERS = {
      admin:   { password: 'admin123',   role: 'Admin'   },
      faculty: { password: 'faculty123', role: 'Faculty' }
    };
    const SESSION_KEY = 'clc_session_v23';
    const DATA_KEY = 'clc_state_v23';
    const ORIENT_KEY = 'clc_orientation_v23';
    const CURRENT_COURSE = 'clc_current_course_v23';
    const COURSES_INDEX = 'clc_courses_index_v23';
    const COURSE_LINKS = 'clc_course_links_v23';
    const API_URL_KEY = 'clc_api_url_v23';

    const DEFAULT_INSTITUTE = 'Jayawantrao Sawant Polytechnic Hadapsar(0711)';
    const LEGACY_INSTITUTE  = 'Jaywantrao Sawant Polytechnic Hadapsar(0711)';

    const SECTION_CONFIG = {
      K3: { title: 'FORMATIVE ASSESSMENT OF PRACTICAL(FA-PR)',
            defaults: { marksPerExp: 25, totalExp: 11, faMax: 25, maxMarks: 25, minMarks: 10 } },
      K4: { title: 'SUMMATIVE ASSESMENT OF PRACTICAL(SA-PR)',
            defaults: { examDate: '3&4/11/2025', maxMarks: 25, minMarks: 10 } },
      K5: { title: 'FORMATIVE ASSESMENT OF THEORY (FA-TH)',
            defaults: { ct1Max: 30, ct2Max: 30, maxMarks: 12, minMarks: 30 } },
      K6: { title: 'SELF LEARNING ASSESSMENT (SLA)',
            defaults: { microMax: 25, assignMax: 25, otherMax: 25,
                        slaMax: 25, maxMarks: 25, minMarks: 10 } }
    };
    const FORMATS = ['K3', 'K4', 'K5', 'K6'];
    const SHARED_STUDENT_FORMATS = ['K3', 'K5', 'K6'];
    const SHARED_KEY = 'K3';

    const ACADEMIC_YEARS = ['2026-27','2027-28','2028-29','2029-30','2030-31','2031-32','2032-33'];
    const PROGRAMS = ['CO1K','CO2K','CO3K','CO4K','CO5K','CO6K'];
    const EXAMS = ['Winter-26','Summer-27','Winter-27','Summer-28','Winter-28','Summer-29',
                   'Winter-29','Summer-30','Winter-30','Summer-31','Winter-31','Summer-32','Winter-32'];
    const SEMESTERS = ['I','II','III','IV','V','VI'];

    function getApiUrl() {
      if (GOOGLE_API_URL && GOOGLE_API_URL.startsWith('https://')
          && GOOGLE_API_URL !== 'PASTE_YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE') {
        return GOOGLE_API_URL;
      }
      return localStorage.getItem(API_URL_KEY) || '';
    }

    const num = v => { const n = parseInt(v, 10); return isNaN(n) ? 0 : n; };
    const courseKey = n => String(n || '').trim();
    const normalizeEnrol = v => String(v == null ? '' : v).trim().toLowerCase();

    function matchFieldLabel(field) {
      return { rollNo: 'Roll No.', enrolmentNo: 'Enrolment No.', examSeatNo: 'Exam Seat No.', name: 'Name of Student' }[field] || 'Enrolment No.';
    }
    function getMatchKey(student, field) {
      if (!student) return '';
      const raw = student[field];
      return String(raw == null ? '' : raw).trim().toLowerCase();
    }
    function migrateInstitute(meta) {
      if (!meta) return meta;
      if (!meta.institute || meta.institute === LEGACY_INSTITUTE) meta.institute = DEFAULT_INSTITUTE;
      return meta;
    }
    function isFilled(v) { return v !== undefined && v !== null && String(v).trim() !== ''; }
    function computeSlaFinal(marks, config) {
      const m = marks || {};
      const cols = [];
      if (isFilled(m.micro))  cols.push({ v: num(m.micro),  max: num(config.microMax)  });
      if (isFilled(m.assign)) cols.push({ v: num(m.assign), max: num(config.assignMax) });
      if (isFilled(m.other))  cols.push({ v: num(m.other),  max: num(config.otherMax)  });
      if (cols.length === 0) return 0;
      const rawTotal = cols.reduce((s, c) => s + c.v, 0);
      const rawMax   = cols.reduce((s, c) => s + c.max, 0);
      if (rawMax === 0) return 0;
      return Math.round((rawTotal / rawMax) * (num(config.slaMax) || 0));
    }
    function getActiveSlaColumns(students) {
      let hasMicro = false, hasAssign = false, hasOther = false;
      students.forEach(s => {
        const m = s.marks || {};
        if (isFilled(m.micro))  hasMicro = true;
        if (isFilled(m.assign)) hasAssign = true;
        if (isFilled(m.other))  hasOther = true;
      });
      return { hasMicro, hasAssign, hasOther };
    }

    function buildDefaultState() {
      const s = {};
      FORMATS.forEach(fmt => {
        const d = SECTION_CONFIG[fmt].defaults;
        s[fmt] = {
          meta: {
            board: 'Maharashtra State Board of Technical Education',
            institute: DEFAULT_INSTITUTE, wef: '2025-26', academicYear: '2026-27',
            program: 'CO5K', course: '', exam: 'Winter-26', semester: 'IV',
            faculty: 'Mr.S.S.Shende', courseCode: '315325',
            maxMarks: d.maxMarks, minMarks: d.minMarks
          },
          config: { ...d },
          students: []
        };
        for (let i = 0; i < 5; i++) {
          s[fmt].students.push({ rollNo: String(i + 1), srNo: String(i + 1), enrolmentNo: '', examSeatNo: '', name: '', marks: {} });
        }
      });
      return s;
    }

    function syncSharedStudentsFromMaster(state) {
      const master = state[SHARED_KEY].students || [];
      SHARED_STUDENT_FORMATS.forEach(fmt => {
        if (fmt === SHARED_KEY) return;
        const existing = state[fmt].students || [];
        const byEnrol = new Map();
        existing.forEach(s => {
          const k = normalizeEnrol(s.enrolmentNo); if (k) byEnrol.set(k, s);
          const rk = 'r:' + normalizeEnrol(s.rollNo); if (s.rollNo) byEnrol.set(rk, s);
        });
        state[fmt].students = master.map((m, idx) => {
          let prev = null;
          const ek = normalizeEnrol(m.enrolmentNo);
          if (ek && byEnrol.has(ek)) prev = byEnrol.get(ek);
          else {
            const rk = 'r:' + normalizeEnrol(m.rollNo);
            if (m.rollNo && byEnrol.has(rk)) prev = byEnrol.get(rk);
            else if (existing[idx]) prev = existing[idx];
          }
          return { rollNo: m.rollNo, srNo: m.srNo, enrolmentNo: m.enrolmentNo, examSeatNo: m.examSeatNo, name: m.name,
                   marks: (prev && prev.marks) ? { ...prev.marks } : {} };
        });
      });
    }

    function loadStateFromStorage() {
      try {
        const raw = localStorage.getItem(DATA_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && parsed.K3 && parsed.K4 && parsed.K5 && parsed.K6) {
            FORMATS.forEach(fmt => migrateInstitute(parsed[fmt].meta));
            if (parsed.K6 && parsed.K6.config) {
              if (parsed.K6.config.assignMax === undefined) parsed.K6.config.assignMax = 25;
              if (parsed.K6.config.otherMax === undefined) parsed.K6.config.otherMax = 25;
              if (parsed.K6.config.slaMax === undefined) parsed.K6.config.slaMax = 25;
            }
            syncSharedStudentsFromMaster(parsed);
            return parsed;
          }
        }
      } catch (e) { console.warn(e); }
      return buildDefaultState();
    }

    function formatDate(iso) {
      if (!iso) return '—';
      try { const d = new Date(iso); if (isNaN(d.getTime())) return '—';
        return d.toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
      } catch { return '—'; }
    }

    function readCoursesIndex() { try { return JSON.parse(localStorage.getItem(COURSES_INDEX) || '[]'); } catch { return []; } }
    function writeCoursesIndex(arr) { try { localStorage.setItem(COURSES_INDEX, JSON.stringify(arr)); } catch {} }
    function readCourseLinks() { try { return JSON.parse(localStorage.getItem(COURSE_LINKS) || '{}'); } catch { return {}; } }
    function writeCourseLinks(obj) { try { localStorage.setItem(COURSE_LINKS, JSON.stringify(obj)); } catch {} }

    function FlashMsg({ msg }) {
      if (!msg) return null;
      const colors = { ok: '#1e8e3e', err: '#c62828', info: '#2c5aa0', warn: '#ef6c00' };
      return <div className="flash-msg" style={{ background: colors[msg.kind] || colors.ok }}>{msg.text}</div>;
    }

    function LoginPage({ onLogin }) {
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [role, setRole] = useState('Admin');
      const [error, setError] = useState('');
      const handleLogin = () => {
        setError('');
        const u = username.trim().toLowerCase();
        if (!u || !password) { setError('Please enter username and password.'); return; }
        const acc = USERS[u];
        if (!acc || acc.password !== password) { setError('Invalid username or password.'); return; }
        if (acc.role !== role) { setError(`This user is "${acc.role}". Select correct role.`); return; }
        onLogin({ username: u, role: acc.role, ts: Date.now() });
      };
      return (
        <div className="login-wrapper">
          <div className="login-card">
            <h1>Marks Format K3 / K4 / K5 / K6</h1>
            <div className="subtitle">Prepared by — <b>Mr.S.S.Shende</b> (Computer Department)</div>
            <div className="error">{error}</div>
            <label>Username</label>
            <input value={username} onChange={e => setUsername(e.target.value)} placeholder="Enter username" onKeyDown={e => e.key === 'Enter' && handleLogin()} />
            <label>Password</label>
            <input type="password" value={password} onChange={e => setPassword(e.target.value)} placeholder="Enter password" onKeyDown={e => e.key === 'Enter' && handleLogin()} />
            <label>Login As</label>
            <select value={role} onChange={e => setRole(e.target.value)}><option value="Admin">Admin</option><option value="Faculty">Faculty</option></select>
            <button className="btn-login" onClick={handleLogin}>Sign In</button>
          </div>
        </div>
      );
    }

    function App() {

      useEffect(() => { try { localStorage.setItem(DATA_KEY, JSON.stringify(state)); } catch (e) { console.warn('Auto-save:', e); } }, [state]);
      useEffect(() => { if (course) localStorage.setItem(CURRENT_COURSE, course); }, [course]);

      /* ---------- Dynamic @page orientation ---------- */

      }, [orientation]);

      useEffect(() => {
        const handler = () => {

      }, [state]);

      useEffect(() => {

      }, [apiUrl]);

      const isAdmin = session && session.role === 'Admin';

      const loadCourseFromApi = useCallback(async (name, silent = false) => {

          const url = getApiUrl();

          const res = await fetch(apiUrl, { redirect: 'follow' });
          const json = await res.json();
          if (!json.ok) throw new Error(json.error || 'Course not found');
          const remoteState = json.state;
          if (!remoteState || !remoteState.K3) throw new Error('Empty response from storage');
          const defaultState = buildDefaultState();
          const built = {};
          FORMATS.forEach(fmt => {
            const sec = remoteState[fmt] || {};
            built[fmt] = { meta: { ...defaultState[fmt].meta, ...(sec.meta || {}) }, config: { ...SECTION_CONFIG[fmt].defaults, ...(sec.config || {}) }, students: Array.isArray(sec.students) ? sec.students : [] };
          });

          let totalStudents = 0, totalMarks = 0;

        } catch (e) {
          console.error('[Fetch Error]', e);
          if (!silent) showFlash('❌ Fetch failed: ' + e.message, 'err');
          return false;
        } finally { setLoadingCourse(false); }
      }, [showFlash]);

      useEffect(() => {
        if (!session || !course || !getApiUrl()) return;
        const realCount = (state.K3.students || []).filter(s => s.rollNo || s.name).length;
        if (realCount > 5) return;
        let cancelled = false;
        (async () => { const ok = await loadCourseFromApi(course, true); if (!cancelled && ok) showFlash(`☁️ Auto-loaded "${course}"`, 'info'); })();
        return () => { cancelled = true; };
      }, [session]);

      const updateMeta = (fmt, field, value) => { setState(prev => { const copy = { ...prev }; copy[fmt] = { ...copy[fmt], meta: { ...copy[fmt].meta, [field]: value } }; return copy; }); };
      const updateConfig = (fmt, field, value) => { setState(prev => { const copy = { ...prev }; copy[fmt] = { ...copy[fmt], config: { ...copy[fmt].config, [field]: value } }; return copy; }); };
      const updateStudent = (fmt, i, field, value) => {
        setState(prev => {
          const copy = { ...prev }; copy[fmt] = { ...copy[fmt], students: [...copy[fmt].students] };
          copy[fmt].students[i] = { ...copy[fmt].students[i], [field]: value };
          if (fmt === SHARED_KEY) SHARED_STUDENT_FORMATS.forEach(f => { if (f === SHARED_KEY) return; const t = copy[f].students[i]; if (t) copy[f].students[i] = { ...t, [field]: value }; });
          return copy;
        });
      };
      const updateMark = (fmt, i, key, value) => {
        const v = String(value).replace(/[^0-9]/g, '');
        setState(prev => {
          const copy = { ...prev }; copy[fmt] = { ...copy[fmt], students: [...copy[fmt].students] };
          const stu = { ...copy[fmt].students[i] }; stu.marks = { ...(stu.marks || {}), [key]: v }; copy[fmt].students[i] = stu;
          return copy;
        });
      };
      const addStudent = (fmt) => {
        setState(prev => {
          const copy = { ...prev };
          const newStu = { rollNo: '', srNo: String(copy[fmt].students.length + 1), enrolmentNo: '', examSeatNo: '', name: '', marks: {} };
          copy[fmt] = { ...copy[fmt], students: [...copy[fmt].students, newStu] };
          if (fmt === SHARED_KEY) SHARED_STUDENT_FORMATS.forEach(f => { if (f === SHARED_KEY) return; copy[f] = { ...copy[f], students: [...copy[f].students, { ...newStu, marks: {} }] }; });
          return copy;
        });
      };
      const removeStudent = (fmt, i) => {
        if (SHARED_STUDENT_FORMATS.includes(fmt) && fmt !== SHARED_KEY) { showFlash('Manage students in K3 tab', 'warn'); return; }
        setState(prev => {
          const copy = { ...prev }; copy[fmt] = { ...copy[fmt], students: copy[fmt].students.filter((_, j) => j !== i) };
          if (fmt === SHARED_KEY) SHARED_STUDENT_FORMATS.forEach(f => { if (f === SHARED_KEY) return; copy[f] = { ...copy[f], students: copy[f].students.filter((_, j) => j !== i) }; });
          return copy;
        });
      };
      const clearStudents = (fmt) => {
        if (!confirm(`Clear all student rows for ${fmt}?`)) return;
        setState(prev => {
          const copy = { ...prev }; copy[fmt] = { ...copy[fmt], students: [] };
          if (fmt === SHARED_KEY) SHARED_STUDENT_FORMATS.forEach(f => { if (f === SHARED_KEY) return; copy[f] = { ...copy[f], students: [] }; });
          return copy;
        });
      };

      const handleSaveData = async () => {
        try {
          const url = getApiUrl(); if (!url) { showFlash('⚠️ API URL not set.', 'err'); return; }
          const c = courseKey(course); if (!c) { showFlash('⚠️ Course is mandatory!', 'err'); return; }
          const finalState = JSON.parse(JSON.stringify(state));
          FORMATS.forEach(f => { if (!finalState[f]) finalState[f] = { meta: {}, config: {}, students: [] }; finalState[f].meta.course = c; });
          syncSharedStudentsFromMaster(finalState);
          const res = await fetch(url, { method: 'POST', body: JSON.stringify({ action: 'saveCourse', course: c, state: finalState }), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, redirect: 'follow' });
          const json = await res.json(); if (!json.ok) throw new Error(json.error || 'Save failed');
          if (json.spreadsheetUrl) { const links = { ...readCourseLinks(), [c]: json.spreadsheetUrl }; setCourseLinks(links); writeCourseLinks(links); }
          try { localStorage.setItem(DATA_KEY, JSON.stringify(finalState)); } catch {}
          setState(finalState); await refreshCourseList(true);
          showFlash(`☁️ Saved "${c}"`, 'ok');
        } catch (e) { console.error('[Save Error]', e); showFlash('❌ Save failed: ' + e.message, 'err'); }
      };

      const refreshCourseList = async (silent = false) => {
        try {
          const url = getApiUrl(); if (!url) return false;
          const res = await fetch(url + '?action=listCourses&t=' + Date.now()); const json = await res.json();
          if (!json.ok) throw new Error(json.error || 'List failed');
          const links = { ...readCourseLinks() };
          const idx = (json.courses || []).map(c => { if (c.url) links[c.name] = c.url; return { name: c.name, savedAt: c.updatedAt, courseCode: '', program: '', academicYear: '', exam: '', semester: '' }; });
          writeCoursesIndex(idx); writeCourseLinks(links); setCoursesIndex(idx); setCourseLinks(links); setRefreshTick(n => n + 1);
          if (!silent) showFlash(`🔄 Found ${idx.length} course(s)`, 'ok'); return true;
        } catch (e) { if (!silent) showFlash('Refresh failed: ' + e.message, 'err'); return false; }
      };

      const handleSwitchCourse = async (name) => {
        if (!isAdmin) { showFlash('Only Admin can switch courses', 'err'); return; }
        if (!name) return;
        if (name.toLowerCase() === courseKey(course).toLowerCase()) { showFlash('Already on this course', 'info'); return; }
        if (!confirm(`Switch to course "${name}"?\n\nUnsaved changes will be lost.`)) return;
        await loadCourseFromApi(name);
      };
      const facultySelectCourse = async (name) => {
        if (!isFaculty) return;
        const cur = courseKey(course);
        if (cur && cur.toLowerCase() !== name.toLowerCase()) { if (!confirm(`Switch to course "${name}"?\n\nUnsaved marks will be lost.`)) return; }
        await loadCourseFromApi(name);
      };
      const handleNewCourse = () => {
        if (!isAdmin) { showFlash('Only Admin can start a new course', 'err'); return; }
        if (!confirm('Start a NEW course? Current unsaved changes will be discarded.')) return;
        setCourse(''); setState(buildDefaultState()); showFlash('New course ready — enter course name', 'info');
      };
      const handleDeleteCourse = async (name) => {
        if (!isAdmin) { showFlash('Only Admin can delete courses', 'err'); return; }
        if (!name) return; if (!confirm(`Delete course "${name}"?`)) return;
        try {
          const url = getApiUrl();
          const res = await fetch(url, { method: 'POST', body: JSON.stringify({ action: 'deleteCourse', course: name }), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, redirect: 'follow' });
          const json = await res.json(); if (!json.ok) throw new Error(json.error || 'Delete failed');
          const idx = readCoursesIndex().filter(c => c.name.toLowerCase() !== name.toLowerCase());
          writeCoursesIndex(idx); setCoursesIndex(idx); setRefreshTick(n => n + 1); showFlash(`🗑️ Deleted "${name}"`, 'warn');
        } catch (e) { showFlash('Delete failed: ' + e.message, 'err'); }
      };

      const handleStudentUpload = async (file, fmt) => {
        if (!file) return;
        try {
          const rows = await parseFileRows(file); const students = rowsToStudents(rows);
          if (!students.length) { showFlash('No student rows found.', 'err'); return; }
          setState(prev => {
            const copy = { ...prev }; copy[fmt] = { ...copy[fmt], students };
            if (fmt === SHARED_KEY) {
              SHARED_STUDENT_FORMATS.forEach(f => {
                if (f === SHARED_KEY) return;
                const prevFmt = prev[f].students || [];
                const byEnrol = new Map(); prevFmt.forEach(s => { const k = normalizeEnrol(s.enrolmentNo); if (k) byEnrol.set(k, s); });
                copy[f] = { ...copy[f], students: students.map((n, i) => {
                  const k = normalizeEnrol(n.enrolmentNo); let marks = {};
                  if (k && byEnrol.has(k)) marks = { ...(byEnrol.get(k).marks || {}) };
                  else if (prevFmt[i] && prevFmt[i].marks) marks = { ...prevFmt[i].marks };
                  return { ...n, marks };
                })};
              });
            }
            return copy;
          });
          showFlash(`✔ Uploaded ${students.length} students for ${fmt}`, 'ok');
        } catch (e) { showFlash('Upload error: ' + e.message, 'err'); }
      };

      const handleMarksUpload = async (file, fmt, matchField) => {
        if (!file) return;
        try {
          setUploadStatus(prev => ({ ...prev, [fmt]: '⏳ Parsing…' }));
          const rows = await parseFileRows(file); const map = extractMarksMap(fmt, rows, matchField);
          if (map.size === 0) { setUploadStatus(prev => ({ ...prev, [fmt]: '⚠️ No rows found' })); alert('No valid rows found in file.'); return; }
          const students = [...state[fmt].students]; const lookup = new Map();
          students.forEach((s, i) => { const key = getMatchKey(s, matchField); if (key) lookup.set(key, i); });
          let matched = 0, unmatched = 0, filled = 0; const unmatchedList = [];
          setState(prev => {
            const copy = { ...prev }; const list = [...copy[fmt].students];
            map.forEach((marks, key) => {
              const idx = lookup.get(key); if (idx == null) { unmatched++; unmatchedList.push(key); return; }
              matched++; list[idx] = { ...list[idx] }; list[idx].marks = { ...(list[idx].marks || {}), ...marks };
              filled += Object.keys(marks).length;
            });
            copy[fmt] = { ...copy[fmt], students: list }; return copy;
          });
          let summary = `📥 Upload Summary (${fmt})\n\nMatched by: ${matchFieldLabel(matchField)}\nRows in file: ${map.size}\n✔ Matched: ${matched}\n✔ Marks filled: ${filled}\n✖ Not matched: ${unmatched}`;
          if (unmatchedList.length > 0) { const preview = unmatchedList.slice(0, 10).join(', '); const more = unmatchedList.length > 10 ? ` … +${unmatchedList.length - 10} more` : ''; summary += `\n\nNot found: ${preview}${more}`; }
          alert(summary);
          setUploadStatus(prev => ({ ...prev, [fmt]: `✔ ${matched} matched · ${filled} marks filled · ${unmatched} not found` }));
          showFlash(`✔ Uploaded ${matched} students (${filled} marks)`, 'ok');
        } catch (e) { setUploadStatus(prev => ({ ...prev, [fmt]: '❌ ' + e.message })); showFlash('Upload error: ' + e.message, 'err'); }
      };

      const downloadMarksTemplate = (fmt) => {
        const headers = ['Enrolment No / Roll No / Exam Seat No / Name'];
        if (fmt === 'K3') { const te = num(state[fmt].config.totalExp) || 11; for (let e = 1; e <= te; e++) headers.push('Exp' + e); }
        else if (fmt === 'K4') headers.push('SA Marks');
        else if (fmt === 'K5') headers.push('CT-1', 'CT-2');
        else if (fmt === 'K6') headers.push('Microproject', 'Assignment', 'Other Activities');
        const rows = [headers];
        const students = state[fmt].students.slice(0, 5);
        if (students.length > 0) { students.forEach(s => { const r = [s.enrolmentNo || s.rollNo || s.name || '']; for (let c = 1; c < headers.length; c++) r.push(''); rows.push(r); }); }
        else { const r = ['E001']; for (let c = 1; c < headers.length; c++) r.push(''); rows.push(r); }
        const wb = XLSX.utils.book_new(); const ws = XLSX.utils.aoa_to_sheet(rows);
        ws['!cols'] = headers.map(() => ({ wch: 15 })); XLSX.utils.book_append_sheet(wb, ws, fmt + '-Template');
        XLSX.writeFile(wb, `Marks-Template-${fmt}.xlsx`); showFlash(`⬇ Template downloaded for ${fmt}`, 'info');
      };

      const exportExcel = (fmt) => {
        const c = courseKey(course); if (!c) { showFlash('Course name required', 'err'); return; }
        const meta = state[fmt].meta; const config = state[fmt].config; const students = state[fmt].students;
        const wb = XLSX.utils.book_new(); const rows = [];
        rows.push([fmt, '', '', '', '', `Wef-${meta.wef}`]); rows.push([meta.board]);
        if (fmt === 'K3') {
          const mpe = num(config.marksPerExp) || 25; const te = num(config.totalExp) || 11; const faMax = num(config.faMax) || 25; const totalMax = mpe * te;
          rows.push([SECTION_CONFIG.K3.title]);
          rows.push([`Institute Code and Name: ${meta.institute}`, '', '', '', '', `Academic Year: ${meta.academicYear}`]);
          rows.push([`Program: ${meta.program}`, '', `Course: ${meta.course}`, '', `Exam: ${meta.exam}`]);
          rows.push([`Semester: ${meta.semester}`, '', `Name of Faculty: ${meta.faculty}`, '', `Course Code: ${meta.courseCode}`]);
          rows.push([`Maximum Marks: ${meta.maxMarks}`, '', '', '', '', `Minimum Marks: ${meta.minMarks}`]);
          const h1 = ['Roll No.','Sr.No.','Enrolment No.','Exam Seat No.','Name of Student']; const h2 = ['','','','',''];
          for (let e = 1; e <= te; e++) h2.push(String(e));
          h1.push('Experiment', `Total (${mpe}x${te}=${totalMax})`, `FA Converted (Max - ${faMax})`, 'Sign');
          rows.push(h1); rows.push(h2);
          students.forEach(s => {
            const m = s.marks || {}; let total = 0; const exps = [];
            for (let e = 1; e <= te; e++) { const v = num(m['exp' + e]); exps.push(v || ''); total += v; }
            const fa = totalMax > 0 ? Math.round((total / totalMax) * faMax) : 0;
            rows.push([s.rollNo, s.srNo, s.enrolmentNo, s.examSeatNo, s.name, ...exps, total, fa, '']);
          });
          rows.push([]); rows.push(['', 'Name of Faculty', '', '', '', '', '', '', 'HOD']);
        } else if (fmt === 'K4') {
          rows.push([SECTION_CONFIG.K4.title]);
          rows.push([`Institute Code and Name: ${meta.institute}`, '', '', '', '', `Academic Year: ${meta.academicYear}`]);
          rows.push([`Program: ${meta.program}`, '', `Course: ${meta.course}`, '', `Exam: ${meta.exam}`]);
          rows.push([`Semester: ${meta.semester}`, '', `Name of Faculty: ${meta.faculty}`, '', `Course Code: ${meta.courseCode}`]);
          rows.push([`Maximum Marks: ${meta.maxMarks}`, '', '', '', '', `Minimum Marks: ${meta.minMarks}`]);
          rows.push([`Date of Examination: ${config.examDate}`]);
          rows.push(['Roll No','Sr.No','Enrolment No','Exam Seat No','Name of Student', `SA Marks (Max - ${meta.maxMarks})`]);
          students.forEach(s => rows.push([s.rollNo, s.srNo, s.enrolmentNo, s.examSeatNo, s.name, (s.marks && s.marks.sa) || '']));
          rows.push([]); rows.push([]); rows.push(['', 'Signature of Internal Examiner', '', '', '', 'Signature of External Examinar']);
        } else if (fmt === 'K5') {
          const c1 = num(config.ct1Max) || 30; const c2 = num(config.ct2Max) || 30;
          rows.push([SECTION_CONFIG.K5.title]);
          rows.push([`Institute Code and Name: ${meta.institute}`, '', '', '', '', `Academic Year: ${meta.academicYear}`]);
          rows.push([`Program: ${meta.program}`, '', `Course: ${meta.course}`, '', `Exam: ${meta.exam}`]);
          rows.push([`Semester: ${meta.semester}`, '', `Name of Faculty: ${meta.faculty}`, '', `Course Code: ${meta.courseCode}`]);
          rows.push([`Maximum Marks: ${meta.maxMarks}`, '', '', '', '', `Minimum Marks: ${meta.minMarks}`]);
          rows.push(['Roll No','Sr.No','Enrolment No.','Exam Seat No.','Name of the Student', `CT-1 (Out of ${c1})`, `CT-2 (Out of ${c2})`, `Average (Out of ${c1})`, 'Sign']);
          students.forEach(s => { const m = s.marks || {}; const v1 = m.ct1 ?? '', v2 = m.ct2 ?? '';
            const avg = (v1 !== '' && v2 !== '') ? String(Math.round((num(v1) + num(v2)) / 2)) : '';

          });
          rows.push([]); rows.push(['','Name of Faculty','','','','HOD']);
        } else if (fmt === 'K6') {
          const { hasMicro, hasAssign, hasOther } = getActiveSlaColumns(students);
          const mm = num(config.microMax) || 25; const am = num(config.assignMax) || 25; const om = num(config.otherMax) || 25; const sm = num(config.slaMax) || 25;
          rows.push(['SELF LEARNING ASSESSMENT (SLA)']);
          rows.push([`Institute Code And Name: ${meta.institute}`, '', '', '', '', `Academic Year: ${meta.academicYear}`]);
          rows.push([`Program: ${meta.program}`, '', `Course: ${meta.course}`, '', `Exam: ${meta.exam}`]);
          rows.push([`Semester: ${meta.semester}`, '', `Name of Faculty: ${meta.faculty}`, '', `Course Code: ${meta.courseCode}`]);
          rows.push([`Maximum Marks: ${meta.maxMarks}`, '', '', '', '', `Minimum Marks: ${meta.minMarks}`]);
          const header = ['Roll No','Sr.No.','Enrolment No.','Exam Seat No.','Name of the Student'];
          if (hasMicro) header.push(`Microproject (Out Of ${mm})`); if (hasAssign) header.push(`Assignment (Out Of ${am})`); if (hasOther) header.push(`Other Activities For Specific Learning (Out Of ${om})`);
          header.push(`SLA Marks According To L-A Scheme (Total Of all SLA Activities) (Max Mark ${sm})`); header.push('Sign');
          rows.push(header);
          students.forEach(s => { const m = s.marks || {}; const finalMark = computeSlaFinal(m, config);
            const row = [s.rollNo, s.srNo, s.enrolmentNo, s.examSeatNo, s.name];
            if (hasMicro) row.push(m.micro ?? ''); if (hasAssign) row.push(m.assign ?? ''); if (hasOther) row.push(m.other ?? '');
            row.push(finalMark); row.push(''); rows.push(row);
          });
          rows.push([]); rows.push(['','Name of Faculty','','','','HOD']);
        }
        const ws = XLSX.utils.aoa_to_sheet(rows);
        ws['!cols'] = [{wch:10},{wch:8},{wch:16},{wch:14},{wch:28},{wch:12},{wch:12},{wch:12},{wch:12},{wch:12},{wch:12},{wch:12},{wch:12},{wch:12},{wch:12},{wch:12},{wch:18},{wch:18},{wch:14}];
        XLSX.utils.book_append_sheet(wb, ws, fmt);
        const safeCourse = c.replace(/[^a-zA-Z0-9_-]/g, '_'); XLSX.writeFile(wb, `Marks-${fmt}-${safeCourse}.xlsx`);
      };

      const exportPDF = (fmt) => {
        const c = courseKey(course); if (!c) { showFlash('Course name required', 'err'); return; }
        const meta = state[fmt].meta; const config = state[fmt].config; const students = state[fmt].students;
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation: orientation, unit: 'mm', format: 'a4' });
        const pageW = orientation === 'landscape' ? 297 : 210;
        let y = 12;
        doc.setFont('times', 'normal'); doc.setFontSize(10);
        doc.text(fmt, 12, y); doc.text(`Wef-${meta.wef}`, pageW - 12, y, { align: 'right' }); y += 6;
        doc.setFont('times', 'bold'); doc.setFontSize(12); doc.text(meta.board, pageW / 2, y, { align: 'center' }); y += 6;
        doc.setFontSize(11); doc.text(SECTION_CONFIG[fmt].title, pageW / 2, y, { align: 'center' }); y += 7;
        doc.setFont('times', 'normal'); doc.setFontSize(9);
        const leftX = 12, midX = pageW * 0.42, rightX = pageW - 12;
        doc.text(`Institute Code and Name: ${meta.institute}`, leftX, y); doc.text(`Academic Year: ${meta.academicYear}`, rightX, y, { align: 'right' }); y += 5;
        doc.text(`Program: ${meta.program}`, leftX, y); doc.text(`Course: ${meta.course}`, midX, y); doc.text(`Exam: ${meta.exam}`, rightX, y, { align: 'right' }); y += 5;
        doc.text(`Semester: ${meta.semester}`, leftX, y); doc.text(`Name of Faculty: ${meta.faculty}`, midX, y); doc.text(`Course Code: ${meta.courseCode}`, rightX, y, { align: 'right' }); y += 5;
        doc.text(`Maximum Marks: ${meta.maxMarks}`, leftX, y); doc.text(`Minimum Marks: ${meta.minMarks}`, rightX, y, { align: 'right' }); y += 6;
        let head = [], body = [];
        if (fmt === 'K3') {
          const mpe = num(config.marksPerExp) || 25; const te = num(config.totalExp) || 11; const faMax = num(config.faMax) || 25; const totalMax = mpe * te;
          const h = ['Roll No.','Sr.No.','Enrolment No.','Exam Seat No.','Name of Student']; for (let e = 1; e <= te; e++) h.push(String(e)); h.push('Total','FA Conv.','Sign');
          head = [h];
          body = students.map(s => { const m = s.marks || {}; let total = 0; const exps = [];
            for (let e = 1; e <= te; e++) { const v = num(m['exp' + e]); exps.push(v || ''); total += v; }
            const fa = totalMax > 0 ? Math.round((total / totalMax) * faMax) : 0;
            return [s.rollNo, s.srNo, s.enrolmentNo, s.examSeatNo, s.name, ...exps, total, fa, ''];
          });
        } else if (fmt === 'K4') {
          head = [['Roll No','Sr.No','Enrolment No','Exam Seat No','Name of Student', `SA Marks (Max ${meta.maxMarks})`]];
          body = students.map(s => [s.rollNo, s.srNo, s.enrolmentNo, s.examSeatNo, s.name, (s.marks && s.marks.sa) || '']);
        } else if (fmt === 'K5') {
          const c1 = num(config.ct1Max) || 30; const c2 = num(config.ct2Max) || 30;
          head = [['Roll No','Sr.No','Enrolment No.','Exam Seat No.','Name of Student', `CT-1 (/${c1})`, `CT-2 (/${c2})`, `Average (/${c1})`, 'Sign']];
          body = students.map(s => { const m = s.marks || {}; const v1 = m.ct1 ?? '', v2 = m.ct2 ?? '';
            const avg = (v1 !== '' && v2 !== '') ? String(Math.round((num(v1) + num(v2)) / 2)) : '';
            return [s.rollNo, s.srNo, s.enrolmentNo, s.examSeatNo, s.name, v1, v2, avg, ''];
          });
        } else if (fmt === 'K6') {
          const { hasMicro, hasAssign, hasOther } = getActiveSlaColumns(students);
          const mm = num(config.microMax) || 25; const am = num(config.assignMax) || 25; const om = num(config.otherMax) || 25; const sm = num(config.slaMax) || 25;
          const headerRow = ['Roll No','Sr.No.','Enrolment No.','Exam Seat No.','Name of Student'];
          if (hasMicro) headerRow.push(`Microproject (/${mm})`); if (hasAssign) headerRow.push(`Assignment (/${am})`); if (hasOther) headerRow.push(`Other (/${om})`);
          headerRow.push(`SLA L-A (/${sm})`); headerRow.push('Sign'); head = [headerRow];
          body = students.map(s => { const m = s.marks || {}; const finalMark = computeSlaFinal(m, config);
            const row = [s.rollNo, s.srNo, s.enrolmentNo, s.examSeatNo, s.name];
            if (hasMicro) row.push(m.micro ?? ''); if (hasAssign) row.push(m.assign ?? ''); if (hasOther) row.push(m.other ?? '');
            row.push(finalMark); row.push(''); return row;
          });
        }
        doc.autoTable({
          head, body: body.length ? body : [['—','—','—','—','No students','—','—','—','—']],
          startY: y, margin: { left: 12, right: 12 },
          styles: { font: 'times', fontSize: 8, cellPadding: 1.6, lineColor: [0,0,0], lineWidth: 0.2 },
          headStyles: { font: 'times', fontStyle: 'bold', fillColor: [255,255,255], textColor: [0,0,0], halign: 'center' },
          columnStyles: { 4: { halign: 'left' } }, theme: 'grid'
        });
        const fy = doc.lastAutoTable.finalY + 22;
        doc.setFont('times', 'bold'); doc.setFontSize(10);
        if (fmt === 'K4') { doc.text('Signature of Internal Examiner', pageW * 0.25, fy, { align: 'center' }); doc.text('Signature of External Examinar', pageW * 0.75, fy, { align: 'center' }); }
        else { doc.text('Name of Faculty', pageW * 0.25, fy, { align: 'center' }); doc.text('HOD', pageW * 0.75, fy, { align: 'center' }); }
        const safeCourse = c.replace(/[^a-zA-Z0-9_-]/g, '_'); doc.save(`Marks-${fmt}-${safeCourse}.pdf`);
      };

      if (!session) return (<><LoginPage onLogin={setSession} /><FlashMsg msg={flash} /></>);

      const apiReady = !!getApiUrl(); const apiOk = apiReady && apiStatus === 'ok';

      return (
        <div className="container">
          <FlashMsg msg={flash} />
          <div className="app-header no-print">
            <div style={{ minWidth: 180 }}></div>
            <div className="title-block">
              <h1>Marks Format K3 / K4 / K5 / K6</h1>
              <div className="prepared">Prepared by — <b>Mr.S.S.Shende</b> (Computer Department)</div>
            </div>
            <div className="user-box">
              <span className={'badge' + (session.role === 'Faculty' ? ' faculty' : '')}>{session.role}</span>
              <span>{session.username}</span>
              <button className="btn btn-success" onClick={handleSaveData}>☁️ Save</button>
              <button className="btn btn-secondary" onClick={() => { if (confirm('Logout?')) setSession(null); }}>Logout</button>
            </div>
          </div>

          <div className={'course-bar no-print' + (!course ? ' missing' : '') + (isFaculty && course ? ' locked' : '')}>
            <label>📚 Course {isAdmin && <span className="required">*</span>}:</label>
            <input value={course} disabled={isFaculty} placeholder={isAdmin ? 'Enter course name' : 'Waiting for Admin…'}
              onChange={e => { if (!isAdmin) return; setCourse(e.target.value);
                setState(prev => { const copy = { ...prev }; FORMATS.forEach(f => { copy[f] = { ...copy[f], meta: { ...copy[f].meta, course: e.target.value } }; }); return copy; }); }} />
            {isAdmin && (<>
              <button className="btn btn-warning" onClick={handleNewCourse}>➕ New Course</button>
              <select value="" onChange={e => handleSwitchCourse(e.target.value)} style={{ minWidth: 220 }}>
                <option value="">— Switch to saved course —</option>
                {coursesIndex.map(c => (<option key={c.name} value={c.name}>{c.name}</option>))}
              </select>
            </>)}
            <button className="btn btn-info" disabled={loadingCourse || !course} onClick={async () => { if (!course) { showFlash('No course selected', 'warn'); return; } await loadCourseFromApi(course); }}>
              {loadingCourse ? '⏳ Fetching…' : '📥 Fetch'}
            </button>
            {isFaculty && course && <span className="lock-badge">🔒 Set by Admin</span>}
            <span className="info">{!course ? (isAdmin ? '⚠️ Course is mandatory' : '⚠️ Pick a course from the list below') : (isFaculty ? `🔒 Active: "${course}"` : `✅ Active: "${course}"`)}</span>
          </div>

          {isFaculty && (
            <div className="faculty-courses-panel no-print">
              <h2>📚 Available Courses</h2>
              {coursesIndex.length === 0 ? (<div className="hint" style={{ color: '#721c24' }}>⚠️ No courses yet. Ask Admin to save a course, or click "🔄 Refresh".</div>) : (
                <div className="courses-grid">
                  {coursesIndex.map(c => {
                    const isActive = c.name.toLowerCase() === courseKey(course).toLowerCase();
                    return (<div key={c.name} className={'course-card' + (isActive ? ' active' : '')}>
                      <div className="card-top"><div className="cname" onClick={() => facultySelectCourse(c.name)}>{c.name}</div>
                        <button className="btn btn-info fetch-btn" disabled={loadingCourse} onClick={async (e) => { e.stopPropagation(); await loadCourseFromApi(c.name); }}>{loadingCourse ? '⏳' : '📥 Fetch'}</button>
                      </div>
                      <div className="cmeta">{c.savedAt && <div><b>Updated:</b> {formatDate(c.savedAt)}</div>}</div>
                    </div>);
                  })}
                </div>
              )}
            </div>
          )}

          {isAdmin && (
            <div className="admin-panel no-print">
              <h2>👨‍💼 Admin — Course Files</h2>
              {coursesIndex.length === 0 ? (<div className="hint">No courses found. Enter a course name → Save. Then click "🔄 Refresh".</div>) : (
                <table className="records-table"><thead><tr><th>#</th><th>Course Name</th><th>Sheet Link</th><th>Last Updated</th><th>Actions</th></tr></thead>
                  <tbody>{coursesIndex.map((c, i) => (<tr key={c.name}><td>{i + 1}</td><td><b>{c.name}</b></td><td>—</td><td>{formatDate(c.savedAt)}</td>
                    <td><button className="btn btn-info" style={{ fontSize: 11, padding: '4px 10px' }} onClick={() => loadCourseFromApi(c.name)}>📥 Fetch</button>
                      <button className="btn btn-primary" style={{ fontSize: 11, padding: '4px 10px' }} onClick={() => handleSwitchCourse(c.name)}>📥 Load</button>
                      <button className="btn btn-danger" style={{ fontSize: 11, padding: '4px 10px' }} onClick={() => handleDeleteCourse(c.name)}>🗑️ Delete</button></td></tr>))}
                  </tbody></table>
              )}
            </div>
          )}

          <div className="toolbar no-print">
            <span style={{ fontSize: 12, fontWeight: 600 }}>Print Orientation:</span>
            <button className={'btn btn-toggle' + (orientation === 'portrait' ? ' active' : '')} onClick={() => setOrientation('portrait')}>Portrait</button>
            <button className={'btn btn-toggle' + (orientation === 'landscape' ? ' active' : '')} onClick={() => setOrientation('landscape')}>Landscape</button>
            <span className="spacer"></span><span className="hint">A4 · Times New Roman</span>
          </div>

          <div className="tabs no-print">
            {FORMATS.map(f => (<button key={f} className={'tab' + (activeTab === f ? ' active' : '')} onClick={() => setActiveTab(f)}>{f} — {SECTION_CONFIG[f].title}</button>))}
          </div>

          <FormatSection fmt={activeTab} state={state} course={course} isAdmin={isAdmin} isFaculty={isFaculty}
            onMetaChange={(field, value) => updateMeta(activeTab, field, value)}
            onConfigChange={(field, value) => updateConfig(activeTab, field, value)}
            onStudentChange={(i, f, v) => updateStudent(activeTab, i, f, v)}
            onMarkChange={(i, k, v) => updateMark(activeTab, i, k, v)}
            onAddStudent={() => addStudent(activeTab)} onRemoveStudent={(i) => removeStudent(activeTab, i)}
            onClearStudents={() => clearStudents(activeTab)} onStudentUpload={handleStudentUpload}
            onMarksUpload={handleMarksUpload} onDownloadTemplate={downloadMarksTemplate}
            onExportExcel={exportExcel} onExportPDF={exportPDF} uploadStatus={uploadStatus[activeTab]}
            setActiveTab={setActiveTab} />
        </div>
      );
    }

    function FormatSection(props) {
      const { fmt, state, course, isAdmin, isFaculty, onMetaChange, onConfigChange, onStudentChange, onMarkChange, onAddStudent, onRemoveStudent, onClearStudents, onStudentUpload, onMarksUpload, onDownloadTemplate, onExportExcel, onExportPDF, uploadStatus, setActiveTab } = props;
      const [matchField, setMatchField] = useState('enrolmentNo');
      const meta = state[fmt].meta; const config = state[fmt].config; const students = state[fmt].students;
      const isShared = SHARED_STUDENT_FORMATS.includes(fmt); const isMaster = (fmt === SHARED_KEY); const readOnlyShared = (isShared && !isMaster); const disabledFields = isFaculty;
      const slaMaxVal = num(config.slaMax) || 25;
      return (
        <>
          <div className="card no-print">
            <h2>1. Common Fields — {fmt}</h2>
            <div className="grid">
              <div><label>Board</label><input value={meta.board} readOnly /></div>
              <div><label>Institute Code and Name</label><input value={meta.institute} disabled={disabledFields} onChange={e => onMetaChange('institute', e.target.value)} /></div>
              <div><label>K Format</label><input value={fmt} readOnly /></div>
              <div><label>W.e.f.</label><input value={meta.wef} disabled={disabledFields} onChange={e => onMetaChange('wef', e.target.value)} /></div>
              <div><label>Academic Year</label><select value={meta.academicYear} disabled={disabledFields} onChange={e => onMetaChange('academicYear', e.target.value)}>{ACADEMIC_YEARS.map(y => <option key={y}>{y}</option>)}</select></div>
              <div><label>Program</label><select value={meta.program} disabled={disabledFields} onChange={e => onMetaChange('program', e.target.value)}>{PROGRAMS.map(p => <option key={p}>{p}</option>)}</select></div>
              <div><label>Course (from top bar)</label><input value={course} readOnly /></div>
              <div><label>Exam</label><select value={meta.exam} disabled={disabledFields} onChange={e => onMetaChange('exam', e.target.value)}>{EXAMS.map(x => <option key={x}>{x}</option>)}</select></div>
              <div><label>Semester</label><select value={meta.semester} disabled={disabledFields} onChange={e => onMetaChange('semester', e.target.value)}>{SEMESTERS.map(s => <option key={s}>{s}</option>)}</select></div>
              <div><label>Name of Faculty</label><input value={meta.faculty} disabled={disabledFields} onChange={e => onMetaChange('faculty', e.target.value)} /></div>
              <div><label>Course Code</label><input value={meta.courseCode} disabled={disabledFields} onChange={e => onMetaChange('courseCode', e.target.value)} /></div>
              <div><label>Maximum Marks</label><input type="number" value={meta.maxMarks} disabled={disabledFields} onChange={e => onMetaChange('maxMarks', e.target.value)} /></div>
              <div><label>Minimum Marks</label><input type="number" value={meta.minMarks} disabled={disabledFields} onChange={e => onMetaChange('minMarks', e.target.value)} /></div>
            </div>
          </div>

          <div className="card no-print">
            <h2>2. Section Configuration — {fmt}</h2>
            <div className="grid">
              {fmt === 'K3' && (<>
                <div><label>Marks Per Experiment</label><input type="number" value={config.marksPerExp} disabled={disabledFields} onChange={e => onConfigChange('marksPerExp', e.target.value)} /></div>
                <div><label>Total Experiments</label><input type="number" value={config.totalExp} disabled={disabledFields} onChange={e => onConfigChange('totalExp', e.target.value)} /></div>
                <div><label>Total Marks (auto)</label><input readOnly value={num(config.marksPerExp) * num(config.totalExp)} /></div>
                <div><label>FA Converted Max Marks</label><input type="number" value={config.faMax} disabled={disabledFields} onChange={e => onConfigChange('faMax', e.target.value)} /></div>
              </>)}
              {fmt === 'K4' && (<div><label>Date of Examination</label><input value={config.examDate || ''} disabled={disabledFields} onChange={e => onConfigChange('examDate', e.target.value)} /></div>)}
              {fmt === 'K5' && (<>
                <div><label>Class Test-1 Max</label><input type="number" value={config.ct1Max} disabled={disabledFields} onChange={e => onConfigChange('ct1Max', e.target.value)} /></div>
                <div><label>Class Test-2 Max</label><input type="number" value={config.ct2Max} disabled={disabledFields} onChange={e => onConfigChange('ct2Max', e.target.value)} /></div>
              </>)}
              {fmt === 'K6' && (<>
                <div><label>Microproject Max</label><input type="number" value={config.microMax} disabled={disabledFields} onChange={e => onConfigChange('microMax', e.target.value)} /></div>
                <div><label>Assignment Max</label><input type="number" value={config.assignMax} disabled={disabledFields} onChange={e => onConfigChange('assignMax', e.target.value)} /></div>
                <div><label>Other Activities Max</label><input type="number" value={config.otherMax} disabled={disabledFields} onChange={e => onConfigChange('otherMax', e.target.value)} /></div>
                <div><label>SLA L-A Scheme Max Marks</label><input type="number" value={config.slaMax} disabled={disabledFields} onChange={e => onConfigChange('slaMax', e.target.value)} /></div>
              </>)}
            </div>
            {fmt === 'K6' && (<div className="highest-hint">
              📐 <b>Auto-select from filled activities:</b> The L-A Scheme total is calculated using only the columns that contain marks.<br />
              • Only Microproject filled → scaled against Microproject Max.<br />• Only Assignment filled → scaled against Assignment Max.<br />• Only Other Activities filled → scaled against Other Activities Max.<br />• Two or three filled → scaled against the sum of those Maxes.<br />
              Final L-A Scheme Max = <b>{slaMaxVal}</b>
            </div>)}
          </div>

          <div className="card no-print">
            <h2>3. Student Data — {fmt}</h2>
            {isShared ? (<div className="shared-notice">🔗 <b>Shared student list:</b> K3, K5 &amp; K6 use the <b>same student list</b>. {isMaster ? 'Edits here update K5 & K6 automatically.' : <span className="link" onClick={() => setActiveTab(SHARED_KEY)}>Manage students in {SHARED_KEY} tab</span>}</div>) : (<div className="shared-notice k4">🔒 <b>Separate student list:</b> K4 has its own student list.</div>)}
            <div className="toolbar">
              <label style={{ margin: 0, fontSize: 12 }}>{readOnlyShared ? 'Student list (read-only — edit in K3)' : 'Upload student list (Excel/CSV/HTML):'}</label>
              {!readOnlyShared && (<>
                <input type="file" accept=".xlsx,.xls,.csv,.html,.htm" style={{ width: 'auto' }} onChange={e => { const f = e.target.files[0]; if (f) onStudentUpload(f, fmt); e.target.value = ''; }} />
                <button className="btn btn-primary" onClick={onAddStudent}>+ Add Row</button>
                <button className="btn btn-danger" onClick={onClearStudents}>Clear All</button>
              </>)}
              <span className="spacer"></span><span className="hint">{students.length} students</span>
            </div>
            <div style={{ overflowX: 'auto' }}>
              <table className="marks"><thead><tr><th style={{ width: 70 }}>Roll No.</th><th style={{ width: 60 }}>Sr.No.</th><th style={{ width: 110 }}>Enrolment No.</th><th style={{ width: 100 }}>Exam Seat No.</th><th className="name" style={{ minWidth: 180 }}>Name of Student</th>{!readOnlyShared && <th style={{ width: 50 }}>#</th>}</tr></thead>
                <tbody>{students.map((s, i) => (<tr key={i}>
                  <td><input className="cell" value={s.rollNo || ''} readOnly={readOnlyShared} onChange={e => onStudentChange(i, 'rollNo', e.target.value)} /></td>
                  <td><input className="cell" value={s.srNo || ''} readOnly={readOnlyShared} onChange={e => onStudentChange(i, 'srNo', e.target.value)} /></td>
                  <td><input className="cell" value={s.enrolmentNo || ''} readOnly={readOnlyShared} onChange={e => onStudentChange(i, 'enrolmentNo', e.target.value)} /></td>
                  <td><input className="cell" value={s.examSeatNo || ''} readOnly={readOnlyShared} onChange={e => onStudentChange(i, 'examSeatNo', e.target.value)} /></td>
                  <td className="name"><input className="cell" style={{ textAlign: 'left' }} value={s.name || ''} readOnly={readOnlyShared} onChange={e => onStudentChange(i, 'name', e.target.value)} /></td>
                  {!readOnlyShared && (<td><button className="btn btn-danger" style={{ padding: '2px 8px', fontSize: 11 }} onClick={() => onRemoveStudent(i)}>×</button></td>)}
                </tr>))}
                </tbody></table>
            </div>
          </div>

          <div className="upload-box no-print">
            <div className="upload-row">
              <label>📥 Upload Marks — Match by:</label>
              <select className="match-select" value={matchField} onChange={e => setMatchField(e.target.value)}>
                <option value="rollNo">1. Roll No.</option><option value="enrolmentNo">2. Enrolment No.</option><option value="examSeatNo">3. Exam Seat No.</option><option value="name">4. Name of Student</option>
              </select>
              <input type="file" accept=".xlsx,.xls,.csv" onChange={e => { const f = e.target.files[0]; if (f) onMarksUpload(f, fmt, matchField); e.target.value = ''; }} />
              <button className="btn btn-info" onClick={() => onDownloadTemplate(fmt)}>⬇ Download Template</button>
            </div>
            <div style={{ marginTop: 6, display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap' }}>
              <span className="status">{uploadStatus}</span><span className="example">Column 1 must be <b>{matchFieldLabel(matchField)}</b></span>
            </div>
          </div>

          <div className="card no-print">
            <h2>4. Marks Entry &amp; Preview — {fmt}</h2>
            <div className="toolbar">
              <button className="btn btn-success" onClick={() => onExportExcel(fmt)}>Save as Excel</button>
              <button className="btn btn-danger" onClick={() => onExportPDF(fmt)}>Save as PDF</button>
              <button className="btn btn-primary" onClick={() => window.print()}>Print</button>
            </div>
          </div>

          <FormatPreview fmt={fmt} meta={meta} config={config} students={students} onMarkChange={onMarkChange} />
        </>
      );
    }

    function FormatPreview({ fmt, meta, config, students, onMarkChange }) {
      const renderK3 = () => {
        const mpe = num(config.marksPerExp) || 25; const te = num(config.totalExp) || 11; const faMax = num(config.faMax) || 25; const totalMax = mpe * te;
        const expCols = []; for (let e = 1; e <= te; e++) expCols.push(<th key={e} style={{ width: 32 }}>{e}</th>);
        return (
          <table className="marks"><thead><tr>
            <th rowSpan={2}>Roll No.</th><th rowSpan={2}>Sr.No.</th><th rowSpan={2}>Enrolment No.</th><th rowSpan={2}>Exam Seat No.</th><th rowSpan={2} className="name">Name of Student</th>
            <th colSpan={te}>Experiment /Assignment/Sheet/Job/ProjectActivity<br />(Marks out of {mpe} per experiment)</th>
            <th rowSpan={2}>Total Marks out of ({mpe}x{te}={totalMax})</th>
            <th rowSpan={2}>FA Marks of Practical Converted According to L-A Scheme<br />(Max Marks - {faMax})</th>
            <th rowSpan={2}>Signature of Students</th>
          </tr><tr>{expCols}</tr></thead>
            <tbody>{students.map((s, i) => {
              const m = s.marks || {}; let total = 0; const cells = [];
              for (let e = 1; e <= te; e++) { const key = 'exp' + e; const v = m[key] ?? ''; total += num(v);
                cells.push(<td key={e}><input type="text" inputMode="numeric" className="cell" value={v} onChange={ev => onMarkChange(i, key, ev.target.value)} /></td>); }
              const fa = totalMax > 0 ? Math.round((total / totalMax) * faMax) : 0;
              const below = num(meta.maxMarks) > 0 && total < num(meta.minMarks) && total > 0;
              const cls = total === 0 ? '' : (below ? 'below-min' : 'ok');
              return (<tr key={i} className={cls}><td>{s.rollNo}</td><td>{s.srNo}</td><td>{s.enrolmentNo}</td><td>{s.examSeatNo}</td><td className="name">{s.name}</td>{cells}<td><b>{total}</b></td><td><b>{fa}</b></td><td></td></tr>);
            })}</tbody></table>
        );
      };

      const renderK4 = () => (
        <table className="marks"><thead><tr><th>Roll No</th><th>Sr.No</th><th>Enrolment No</th><th>Exam Seat No</th><th className="name">Name of Student</th><th>Marks obtained in SA Part of Practical as per L-A Scheme<br />(Max Marks - {meta.maxMarks})</th></tr></thead>
          <tbody>{students.map((s, i) => { const v = (s.marks && s.marks.sa) ?? '';
            const below = num(meta.maxMarks) > 0 && v !== '' && num(v) < num(meta.minMarks); const cls = v === '' ? '' : (below ? 'below-min' : 'ok');
            return (<tr key={i} className={cls}><td>{s.rollNo}</td><td>{s.srNo}</td><td>{s.enrolmentNo}</td><td>{s.examSeatNo}</td><td className="name">{s.name}</td>
              <td><input type="text" inputMode="numeric" className="cell wide" value={v} onChange={e => onMarkChange(i, 'sa', e.target.value)} /></td></tr>);
          })}</tbody></table>
      );

      const renderK5 = () => {
        const c1 = num(config.ct1Max) || 30; const c2 = num(config.ct2Max) || 30;
        return (<table className="marks"><thead><tr><th>Roll No</th><th>Sr.No</th><th>Enrolment No.</th><th>Exam Seat No.</th><th className="name">Name of the Student</th><th>Marks of Class Test-1<br />(Out of {c1})</th><th>Marks of Class Test-2<br />(Out of {c2})</th><th>Average of ( Out of {c1})</th><th>Signature of Student</th></tr></thead>
          <tbody>{students.map((s, i) => { const m = s.marks || {}; const v1 = m.ct1 ?? '', v2 = m.ct2 ?? '';
            const avg = (v1 !== '' && v2 !== '') ? String(Math.round((num(v1) + num(v2)) / 2)) : '';
            return (<tr key={i}><td>{s.rollNo}</td><td>{s.srNo}</td><td>{s.enrolmentNo}</td><td>{s.examSeatNo}</td><td className="name">{s.name}</td>
              <td><input type="text" inputMode="numeric" className="cell wide" value={v1} onChange={e => onMarkChange(i, 'ct1', e.target.value)} /></td>
              <td><input type="text" inputMode="numeric" className="cell wide" value={v2} onChange={e => onMarkChange(i, 'ct2', e.target.value)} /></td>
              <td><b>{avg}</b></td><td></td></tr>);
          })}</tbody></table>);
      };

      const renderK6 = () => {
        const { hasMicro, hasAssign, hasOther } = getActiveSlaColumns(students);
        const mm = num(config.microMax) || 25; const am = num(config.assignMax) || 25; const om = num(config.otherMax) || 25; const sm = num(config.slaMax) || 25;
        const activeCount = (hasMicro ? 1 : 0) + (hasAssign ? 1 : 0) + (hasOther ? 1 : 0);
        const showMicro = hasMicro || activeCount === 0; const showAssign = hasAssign || activeCount === 0; const showOther = hasOther || activeCount === 0;
        const shownCount = (showMicro ? 1 : 0) + (showAssign ? 1 : 0) + (showOther ? 1 : 0);
        return (<table className="marks"><thead><tr>
          <th rowSpan={2}>Roll No</th><th rowSpan={2}>Enrolment No.</th><th rowSpan={2}>Exam Seat No.</th><th rowSpan={2} className="name">Name of the Student</th>
          <th colSpan={shownCount}>SLA Activities</th><th rowSpan={2}>SLA Marks According To L-A Scheme (Total Of all SLA Activities)<br />(Max Mark {sm})</th><th rowSpan={2}>Signature Of Student</th>
        </tr><tr>{showMicro && <th>Microproject<br />(Out Of {mm})</th>}{showAssign && <th>Assignment<br />(Out Of {am})</th>}{showOther && <th>Other Activities For Specific Learning<br />(Out of {om})</th>}</tr></thead>
          <tbody>{students.map((s, i) => { const m = s.marks || {}; const finalMark = computeSlaFinal(m, config);
            return (<tr key={i}><td>{s.rollNo}</td><td>{s.enrolmentNo}</td><td>{s.examSeatNo}</td><td className="name">{s.name}</td>
              {showMicro && (<td><input type="text" inputMode="numeric" className="cell wide" value={m.micro ?? ''} onChange={e => onMarkChange(i, 'micro', e.target.value)} /></td>)}
              {showAssign && (<td><input type="text" inputMode="numeric" className="cell wide" value={m.assign ?? ''} onChange={e => onMarkChange(i, 'assign', e.target.value)} /></td>)}
              {showOther && (<td><input type="text" inputMode="numeric" className="cell wide" value={m.other ?? ''} onChange={e => onMarkChange(i, 'other', e.target.value)} /></td>)}
              <td><b>{finalMark}</b></td><td></td></tr>);
          })}</tbody></table>);
      };

      const footer = fmt === 'K4' ? (
        <div className="footer-sign"><div className="block"><div className="single-line">Signature of Internal Examiner</div></div><div className="block"><div className="single-line">Signature of External Examinar</div></div></div>
      ) : (
        <div className="footer-sign"><div className="block">Name of Faculty<div className="line">&nbsp;</div></div><div className="block">HOD<div className="line">&nbsp;</div></div></div>
      );

      return (
        <div className="preview-wrap">
          <div className="print-page">
            <div className="top-row"><span>{fmt}</span><span>Wef-{meta.wef}</span></div>
            <div className="board">{meta.board}</div>
            <div className="title">{SECTION_CONFIG[fmt].title}</div>
            {fmt === 'K4' && <div className="title" style={{ fontSize: 11 }}>(External /Internal)</div>}
            <div className="meta-grid">
              <div className="cell"><b>Institute Code and Name:</b> {meta.institute}</div><div className="cell center"></div><div className="cell right"><b>Academic Year:</b> {meta.academicYear}</div>
              <div className="cell"><b>Program:</b> {meta.program}</div><div className="cell center"><b>Course:</b> {meta.course}</div><div className="cell right"><b>Exam:</b> {meta.exam}</div>
              <div className="cell"><b>Semester:</b> {meta.semester}</div><div className="cell center"><b>Name of Faculty:</b> {meta.faculty}</div><div className="cell right"><b>Course Code:</b> {meta.courseCode}</div>
              <div className="cell"><b>Maximum Marks:</b> {meta.maxMarks}</div><div className="cell center"></div><div className="cell right"><b>Minimum Marks:</b> {meta.minMarks}</div>
            </div>
            {fmt === 'K3' && renderK3()}{fmt === 'K4' && renderK4()}{fmt === 'K5' && renderK5()}{fmt === 'K6' && renderK6()}
            {footer}
          </div>
        </div>
      );
    }

    function parseFileRows(file) {
      const name = file.name.toLowerCase();
      if (name.endsWith('.xlsx') || name.endsWith('.xls')) return readExcelRows(file);
      if (name.endsWith('.csv')) return readCSVRows(file);
      if (name.endsWith('.html') || name.endsWith('.htm')) return readHTMLRows(file);
      return Promise.reject(new Error('Unsupported file type'));
    }
    function readExcelRows(file) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = ev => { try { const wb = XLSX.read(ev.target.result, { type: 'array' }); const ws = wb.Sheets[wb.SheetNames[0]]; res(XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' })); } catch (e) { rej(e); } }; r.onerror = rej; r.readAsArrayBuffer(file); }); }
    function readCSVRows(file) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = ev => { try { const lines = ev.target.result.split(/\r?\n/).filter(l => l.trim()); res(lines.map(l => l.split(',').map(c => c.trim().replace(/^"|"$/g, '')))); } catch (e) { rej(e); } }; r.onerror = rej; r.readAsText(file); }); }
    function readHTMLRows(file) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = ev => { try { const doc = new DOMParser().parseFromString(ev.target.result, 'text/html'); const table = doc.querySelector('table'); if (!table) return rej(new Error('No table found')); const rows = []; table.querySelectorAll('tr').forEach(tr => { const cells = [...tr.querySelectorAll('th,td')].map(c => c.textContent.trim()); if (cells.length) rows.push(cells); }); res(rows); } catch (e) { rej(e); } }; r.onerror = rej; r.readAsText(file); }); }
    function rowsToStudents(rows) { const out = []; rows.forEach((r, idx) => { if (Array.isArray(r)) { if (idx === 0 && /roll/i.test(r[0] || '')) return; out.push({ rollNo: String(r[0] ?? ''), srNo: String(r[1] ?? ''), enrolmentNo: String(r[2] ?? ''), examSeatNo: String(r[3] ?? ''), name: String(r[4] ?? ''), marks: {} }); } }); return out.filter(s => s.rollNo || s.name); }
    function extractMarksMap(fmt, rows, matchField) {
      if (!rows || rows.length === 0) return new Map(); const map = new Map(); let startIdx = 0;
      const first = String((rows[0] && rows[0][0]) || '').trim(); if (/roll|enrol|seat|name/i.test(first)) startIdx = 1;
      for (let i = startIdx; i < rows.length; i++) {
        const row = rows[i]; if (!row || !row.length) continue;
        const key = String(row[0] == null ? '' : row[0]).trim().toLowerCase(); if (!key) continue;
        const marks = {};
        if (fmt === 'K3') { for (let c = 1; c < row.length; c++) { const v = String(row[c] ?? '').trim(); if (!v) continue; const nv = v.replace(/[^0-9]/g, ''); if (nv !== '') marks['exp' + c] = nv; } }
        else if (fmt === 'K4') { const v = String(row[1] ?? '').trim(); if (v) { const nv = v.replace(/[^0-9]/g, ''); if (nv) marks.sa = nv; } }
        else if (fmt === 'K5') { const v1 = String(row[1] ?? '').trim(); const v2 = String(row[2] ?? '').trim(); if (v1) { const nv = v1.replace(/[^0-9]/g, ''); if (nv) marks.ct1 = nv; } if (v2) { const nv = v2.replace(/[^0-9]/g, ''); if (nv) marks.ct2 = nv; } }
        else if (fmt === 'K6') { const v1 = String(row[1] ?? '').trim(); const v2 = String(row[2] ?? '').trim(); const v3 = String(row[3] ?? '').trim(); if (v1) { const nv = v1.replace(/[^0-9]/g, ''); if (nv) marks.micro = nv; } if (v2) { const nv = v2.replace(/[^0-9]/g, ''); if (nv) marks.assign = nv; } if (v3) { const nv = v3.replace(/[^0-9]/g, ''); if (nv) marks.other = nv; } }
        if (Object.keys(marks).length) map.set(key, marks);
      }
      return map;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
